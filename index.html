<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>网页噪音监测器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f7f6;
            touch-action: manipulation;
        }

        h1 {
            color: #333;
            font-size: 1.6rem;
        }

        .meter {
            width: 100%;
            height: 160px;
            background: linear-gradient(to top, #2ecc71, #f1c40f, #e74c3c);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .level {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.3);
            transition: height 0.1s;
        }

        .num {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #555;
        }

        .controls {
            margin-top: 25px;
        }

        button {
            font-size: 1.2rem;
            padding: 14px 28px;
            margin: 0 8px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        #startBtn {
            background-color: #2ecc71;
            color: white;
        }

        #stopBtn {
            background-color: #e74c3c;
            color: white;
        }

        button:disabled {
            background-color: #ccc !important;
            opacity: 0.6;
        }

        .threshold-control {
            margin-top: 25px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        input[type="range"] {
            width: 90%;
            height: 25px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>网页噪音监测器</h1>
    <div class="meter">
        <div class="level" id="level"></div>
        <div class="num" id="num">0</div>
    </div>

    <div class="stats">峰值：<span id="peak">0</span></div>

    <div class="threshold-control">
        <label>报警阈值：<strong id="thresholdValue">50</strong></label><br>
        <input type="range" id="threshold" min="10" max="90" value="50">
    </div>

    <div class="controls">
        <button id="startBtn">开始监测</button>
        <button id="stopBtn" disabled>停止监测</button>
    </div>

    <script>
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let microphone = null;
        let isMonitoring = false;
        let alertTimeout = null;
        let wakeLock = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const levelDiv = document.getElementById('level');
        const numDiv = document.getElementById('num');
        const peakSpan = document.getElementById('peak');
        const thresholdInput = document.getElementById('threshold');
        const thresholdValueSpan = document.getElementById('thresholdValue');

        // 请求保持屏幕常亮（iOS 16.4+ 支持）
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock request failed:', err);
            }
        }

        // 释放屏幕常亮
        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                });
            }
        }

        function playAlert() {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.value = 800;
            gainNode.gain.value = 0.2;

            oscillator.start();
            setTimeout(() => {
                try {
                    oscillator.stop();
                } catch (e) {}
            }, 300);
        }

        thresholdInput.addEventListener('input', function() {
            thresholdValueSpan.textContent = this.value;
        });

        function calculateVolume() {
            if (!isMonitoring) return;

            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;

            numDiv.textContent = Math.round(average);
            levelDiv.style.height = average + '%';
            if (average > parseInt(peakSpan.textContent)) {
                peakSpan.textContent = Math.round(average);
            }

            const threshold = parseInt(thresholdInput.value);
            if (average > threshold) {
                if (!alertTimeout) {
                    playAlert();
                    alertTimeout = setTimeout(() => {
                        alertTimeout = null;
                    }, 1000);
                }
            }

            requestAnimationFrame(calculateVolume);
        }

        async function startMonitoring() {
            try {
                // 初始化 AudioContext（必须由用户点击触发）
                if (!audioContext) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioContextClass();
                }

                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: false
                    } 
                });

                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);

                isMonitoring = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;

                // 申请屏幕常亮
                await requestWakeLock();

                calculateVolume();
            } catch (err) {
                console.error("无法访问麦克风:", err);
                alert("无法获取麦克风权限！\n请确保页面是通过 HTTPS 协议访问，并且 Safari 已被授予麦克风权限。");
            }
        }

        function stopMonitoring() {
            isMonitoring = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;

            if (microphone) {
                microphone.disconnect();
                microphone = null;
            }

            releaseWakeLock();
        }

        startBtn.addEventListener('click', startMonitoring);
        stopBtn.addEventListener('click', stopMonitoring);
    </script>
</body>
</html>
