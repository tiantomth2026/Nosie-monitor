<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>双重环境监测器 (声音+震动)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 500px;
            margin: 15px auto;
            padding: 15px;
            text-align: center;
            background-color: #f4f7f6;
            touch-action: manipulation;
        }

        h1 { color: #333; font-size: 1.4rem; margin-bottom: 15px; }

        .dashboard {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .meter-box {
            flex: 1;
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .meter {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.2);
            margin-top: 8px;
        }

        #audio-meter { background: linear-gradient(to top, #2ecc71, #f1c40f, #e74c3c); }
        #vib-meter { background: linear-gradient(to top, #3498db, #9b59b6, #8e44ad); }

        .level {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.3);
            transition: height 0.05s;
        }

        .num {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .threshold-control {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 0.95rem;
        }

        input[type="range"] {
            width: 100%;
            height: 25px;
            margin: 8px 0;
        }

        .pc-mode-box {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #eee;
            color: #d35400;
            font-size: 0.85rem;
        }

        .controls { margin-top: 20px; }
        .btn-main {
            font-size: 1.1rem; padding: 12px 24px; margin: 0 5px;
            cursor: pointer; border: none; border-radius: 8px; font-weight: bold; color: white;
        }
        #startBtn { background-color: #2ecc71; }
        #stopBtn { background-color: #e74c3c; }
        .btn-main:disabled { background-color: #ccc !important; opacity: 0.6; }

        .status { margin-top: 10px; color: #e74c3c; font-weight: bold; min-height: 20px; font-size: 0.9rem;}

        .log-section {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        #clearBtn {
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .log-box {
            max-height: 180px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #444;
        }

        .log-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .log-list li {
            padding: 6px 0;
            border-bottom: 1px dashed #eee;
            display: flex;
            justify-content: space-between;
        }

        .empty-tip {
            color: #aaa;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>环境双重监测 (需贴紧天花板)</h1>
    
    <div class="dashboard">
        <!-- 声音面板 -->
        <div class="meter-box">
            <div>声音分贝</div>
            <div class="meter" id="audio-meter">
                <div class="level" id="audio-level"></div>
                <div class="num" id="audio-num">0</div>
            </div>
        </div>
        <!-- 震动面板 -->
        <div class="meter-box">
            <div>震动冲击强度</div>
            <div class="meter" id="vib-meter">
                <div class="level" id="vib-level"></div>
                <div class="num" id="vib-num">0.00</div>
            </div>
        </div>
    </div>

    <div class="threshold-control">
        <label>🔊 声音触发阈值：<strong id="audio-th-val">50</strong></label>
        <input type="range" id="audio-th" min="10" max="90" value="50">
        
        <label>📳 震动触发阈值：<strong id="vib-th-val">0.20</strong></label>
        <input type="range" id="vib-th" min="0.05" max="2.00" value="0.20" step="0.05">

        <div class="pc-mode-box">
            <label>
                <input type="checkbox" id="ignore-vib-check"> 💻 忽略震动限制（电脑测试专用）
            </label>
        </div>
    </div>

    <div class="status" id="status-text">未启动</div>

    <div class="controls">
        <button class="btn-main" id="startBtn">启动监测</button>
        <button class="btn-main" id="stopBtn" disabled>停止</button>
    </div>

    <div class="log-section">
        <div class="log-header">
            <span>🚨 触发记录（共 <strong id="trigger-count" style="color: #e74c3c;">0</strong> 次）</span>
            <button id="clearBtn">清空记录</button>
        </div>
        <div class="log-box">
            <p class="empty-tip" id="empty-tip">暂无触发记录</p>
            <ul class="log-list" id="log-list"></ul>
        </div>
    </div>

    <script>
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let microphone = null;
        let mediaStream = null;
        let echoNode = null;
        
        let isMonitoring = false;
        let triggerCooldown = false; 
        let wakeLock = null;
        let triggerCount = 0;

        let currentAudio = 0;
        let currentVib = "0.00";

        let lastX = 0, lastY = 0, lastZ = 0;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('status-text');
        const triggerCountSpan = document.getElementById('trigger-count');
        const logList = document.getElementById('log-list');
        const emptyTip = document.getElementById('empty-tip');
        const clearBtn = document.getElementById('clearBtn');
        const ignoreVibCheck = document.getElementById('ignore-vib-check');

        document.getElementById('audio-th').addEventListener('input', e => document.getElementById('audio-th-val').textContent = e.target.value);
        document.getElementById('vib-th').addEventListener('input', e => document.getElementById('vib-th-val').textContent = parseFloat(e.target.value).toFixed(2));

        function getChinaTimeString() {
            const now = new Date();
            return now.toLocaleString('zh-CN', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }

        // 单例初始化回音节点
        function initEchoEffect() {
            if (!audioContext || echoNode) return;
            
            try {
                const delay = audioContext.createDelay();
                delay.delayTime.value = 0.22;

                const feedback = audioContext.createGain();
                feedback.gain.value = 0.38;

                const filter = audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 280;

                delay.connect(filter);
                filter.connect(feedback);
                feedback.connect(delay);
                delay.connect(audioContext.destination);

                echoNode = delay;
            } catch (e) {
                console.error("回音效果节点创建失败:", e);
            }
        }

        function createCinematicBoom(time) {
            if (!audioContext) return;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, time);
            filter.frequency.exponentialRampToValueAtTime(40, time + 0.8);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(130, time);
            osc.frequency.exponentialRampToValueAtTime(32, time + 0.7);

            gain.gain.setValueAtTime(1.2, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.85);

            osc.connect(filter);
            filter.connect(gain);

            gain.connect(audioContext.destination);
            if (echoNode) {
                gain.connect(echoNode);
            }

            osc.start(time);
            osc.stop(time + 0.85);
        }

        function triggerDoubleKnock() {
            if (triggerCooldown) return;
            triggerCooldown = true;
            statusText.textContent = "⚠️ 触发提示！5秒冷却中...";

            const now = audioContext.currentTime;
            createCinematicBoom(now);
            createCinematicBoom(now + 0.28);

            triggerCount++;
            triggerCountSpan.textContent = triggerCount;
            emptyTip.style.display = 'none';

            const timeStr = getChinaTimeString();
            const li = document.createElement('li');
            li.innerHTML = `<span>${timeStr}</span> <span>音量:${currentAudio} | 震动:${currentVib}</span>`;
            logList.insertBefore(li, logList.firstChild);

            setTimeout(() => {
                triggerCooldown = false;
                if (isMonitoring) statusText.textContent = "监测中...";
            }, 5000);
        }

        clearBtn.addEventListener('click', () => {
            triggerCount = 0;
            triggerCountSpan.textContent = '0';
            logList.innerHTML = '';
            emptyTip.style.display = 'block';
        });

        function handleMotion(event) {
            if (!isMonitoring) return;
            const acc = event.acceleration;
            if (acc) {
                const x = acc.x || 0;
                const y = acc.y || 0;
                const z = acc.z || 0;

                const dx = x - lastX;
                const dy = y - lastY;
                const dz = z - lastZ;

                lastX = x;
                lastY = y;
                lastZ = z;

                const delta = Math.sqrt(dx * dx + dy * dy + dz * dz);
                currentVib = delta.toFixed(2);
            }
        }

        function monitorLoop() {
            if (!isMonitoring) return;

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            currentAudio = Math.round(sum / dataArray.length);

            document.getElementById('audio-num').textContent = currentAudio;
            document.getElementById('audio-level').style.height = currentAudio + '%';
            
            const vibVal = parseFloat(currentVib);
            document.getElementById('vib-num').textContent = currentVib;
            document.getElementById('vib-level').style.height = Math.min((vibVal / 2.0) * 100, 100) + '%';

            const thAudio = parseInt(document.getElementById('audio-th').value);
            const thVib = parseFloat(document.getElementById('vib-th').value);

            const isAudioSatisfied = currentAudio >= thAudio;
            const isVibSatisfied = !ignoreVibCheck.checked && (vibVal >= thVib);

            if ((isAudioSatisfied || isVibSatisfied) && !triggerCooldown) {
                triggerDoubleKnock();
            }

            requestAnimationFrame(monitorLoop);
        }

        async function startMonitoring() {
            try {
                // 1. 在点击的第一时间优先唤醒 AudioContext（关键修补：满足 iOS 手势时效）
                if (!audioContext) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioContextClass();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // 2. 初始化回音效果
                initEchoEffect();

                // 3. 请求震动传感器权限（非阻塞调用）
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission().catch(e => console.log('震动权限未获批:', e));
                }
                window.removeEventListener('devicemotion', handleMotion, true);
                window.addEventListener('devicemotion', handleMotion, true);

                // 4. 获取麦克风流
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                microphone = audioContext.createMediaStreamSource(mediaStream);
                microphone.connect(analyser);

                isMonitoring = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusText.textContent = "监测中...";

                await requestWakeLock();
                monitorLoop();

            } catch (err) {
                console.error("启动失败:", err);
                alert("启动失败: " + (err.message || err.name || "请检查麦克风权限"));
            }
        }

        function stopMonitoring() {
            isMonitoring = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusText.textContent = "未启动";
            window.removeEventListener('devicemotion', handleMotion, true);
            
            // 彻底关闭并释放麦克风硬件资源
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            if (microphone) {
                microphone.disconnect();
                microphone = null;
            }
            if (wakeLock) wakeLock.release().then(() => wakeLock = null);
        }

        startBtn.addEventListener('click', startMonitoring);
        stopBtn.addEventListener('click', stopMonitoring);
    </script>
</body>
</html>
